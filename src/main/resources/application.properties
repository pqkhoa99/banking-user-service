spring.application.name=user-service
logging.level.web=${LOG_LEVEL:TRACE}
logging.level.org.springframework.security=TRACE

# Database Configuration
spring.datasource.url=${DATA_SOURCE_URL:jdbc:postgresql://localhost:5432/userservice}
spring.datasource.username=${DATA_SOURCE_USERNAME:userservice}
spring.datasource.password=${DATA_SOURCE_PASSWORD:userservice}
spring.datasource.driver-class-name=${DATA_SOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# Observability Telemetry
management.endpoints.web.exposure.include=health,prometheus,metrics,httpexchanges
management.otlp.metrics.export.url=http://localhost:4318/v1/metrics
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces
management.otlp.metrics.export.step=10s
management.tracing.sampling.probability=1.0
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# OAuth2 Client Registrations
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}

spring.security.oauth2.client.registration.complete-github.provider=my-github
spring.security.oauth2.client.registration.complete-github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.complete-github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.complete-github.scope=read:user
spring.security.oauth2.client.registration.complete-github.redirect-uri=http://localhost:8080/login/oauth2/code/github
spring.security.oauth2.client.registration.complete-github.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.complete-github.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.complete-github.client-name=Complete Github Client Registration

# OAuth2 Custom Provider
spring.security.oauth2.client.provider.my-github.authorization-uri=https://github.com/login/oauth/authorize
spring.security.oauth2.client.provider.my-github.token-uri=https://github.com/login/oauth/access_token
spring.security.oauth2.client.provider.my-github.user-info-uri=https://api.github.com/user
spring.security.oauth2.client.provider.my-github.user-name-attribute=id